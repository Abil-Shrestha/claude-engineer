[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Abil-Shrestha/claude-engineer"
description = "An open-source software factory: orchestrate swarms of coding agents from work item to reviewed pull request."

[workspace.dependencies]
forgeline-core = { path = "crates/forgeline-core" }
forgeline-config = { path = "crates/forgeline-config" }
forgeline-store = { path = "crates/forgeline-store" }
forgeline-workspace = { path = "crates/forgeline-workspace" }
forgeline-agents = { path = "crates/forgeline-agents" }
forgeline-engine = { path = "crates/forgeline-engine" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
