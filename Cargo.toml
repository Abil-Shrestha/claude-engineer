[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Abil-Shrestha/bodega"
description = "An open-source software factory: orchestrate swarms of coding agents from work item to reviewed pull request."

[workspace.dependencies]
bodega-core = { path = "crates/bodega-core" }
bodega-config = { path = "crates/bodega-config" }
bodega-store = { path = "crates/bodega-store" }
bodega-workspace = { path = "crates/bodega-workspace" }
bodega-agents = { path = "crates/bodega-agents" }
bodega-engine = { path = "crates/bodega-engine" }
bodega-server = { path = "crates/bodega-server" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
ts-rs = { version = "12", features = ["serde-json-impl"] }
uuid = { version = "1", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
