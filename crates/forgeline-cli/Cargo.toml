[package]
name = "forgeline-cli"
description = "The forgeline command: run swarms of coding agents from the terminal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "forgeline"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
forgeline-agents.workspace = true
forgeline-config.workspace = true
forgeline-core.workspace = true
forgeline-engine.workspace = true
forgeline-store.workspace = true
forgeline-workspace.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
